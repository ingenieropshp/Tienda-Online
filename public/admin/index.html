<!doctype html>
<html lang="es">
<head>
  <!-- Codificación y vista para celular -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Título de la pestaña -->
  <title>Panel · DUVAN STORE</title>
  <!-- Que Google no muestre el panel en búsquedas -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#111111">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <!-- Fuentes de marca -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@300;600;700;800&display=swap">
  <!-- Estilos -->
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <!-- Pantalla de ingreso con la clave -->
  <section class="login" id="login" hidden>
    <form class="login-caja" id="form-login">
      <div class="logo" style="font-size:24px"><b>DUVAN</b><span>STORE</span></div>
      <p>Panel de administración</p>
      <div class="campo"><label for="clave">Clave</label><input id="clave" type="password" autocomplete="current-password" required></div>
      <p class="error-form" id="error-login" hidden></p>
      <button class="btn btn-bloque" type="submit">Entrar</button>
    </form>
  </section>

  <!-- Panel (se muestra después de ingresar) -->
  <div class="panel" id="panel" hidden>
    <!-- Menú lateral (abajo en celular) -->
    <nav class="lateral">
      <div class="logo lat-logo"><b>DUVAN</b><span>STORE</span></div>
      <a href="#inicio" data-sec="inicio"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 11 12 4l9 7v9h-6v-6H9v6H3z"/></svg><span>Inicio</span></a>
      <a href="#pedidos" data-sec="pedidos"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg><span>Pedidos</span></a>
      <a href="#productos" data-sec="productos"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 4 4 7l2 4 2-1v10h8V10l2 1 2-4-4-3c-1 2-2.5 3-4 3S9 6 8 4Z"/></svg><span>Productos</span></a>
      <a href="#config" data-sec="config"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg><span>Configuración</span></a>
      <a href="/" target="_blank" class="lat-extra"><span>Ver tienda ↗</span></a>
      <button class="lat-extra salir" id="salir"><span>Salir</span></button>
    </nav>
    <!-- Contenido de la sección elegida -->
    <main class="contenido" id="contenido"></main>
  </div>

  <!-- Aviso breve -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Lógica del panel -->
  <script src="/js/admin.js" type="module"></script>
</body>
</html>

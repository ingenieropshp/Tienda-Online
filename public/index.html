<!doctype html>
<html lang="es">
<head>
  <!-- Codificación para tildes y eñes -->
  <meta charset="utf-8">
  <!-- Vista adaptada al celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Título de la pestaña -->
  <title>SANTOS STORE · Tienda de ropa</title>
  <!-- Descripción para Google y al compartir el enlace -->
  <meta name="description" content="Ropa, zapatos y accesorios en Urabá. Envíos a domicilio y pago al recibir.">
  <meta property="og:title" content="SANTOS STORE">
  <meta property="og:description" content="Envíos a domicilio · Paga al recibir">
  <!-- Color de la barra del navegador en celular -->
  <meta name="theme-color" content="#0b0b0c">
  <!-- Ícono "DS" de la pestaña -->
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <!-- Fuentes de marca: Montserrat (títulos) e Inter (textos) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@300;600;700;800&display=swap">
  <!-- Estilos -->
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/tienda.css">
</head>
<body>
  <!-- Barra superior con el mensaje principal -->
  <div class="barra-top">Envíos a domicilio · Paga al recibir</div>

  <!-- Encabezado: menú, logo, buscador y carrito -->
  <header class="cabecera">
    <div class="cab-in">
      <!-- Botón de menú (celular) -->
      <button class="icono-btn" id="btn-menu" aria-label="Abrir menú">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <!-- Logo que lleva al inicio -->
      <a href="#/" class="logo cab-logo" aria-label="SANTOS STORE, inicio"><b>SANTOS</b><span>STORE</span></a>
      <!-- Menú de categorías (escritorio) -->
      <nav class="cab-nav" id="cab-nav"></nav>
      <!-- Acciones a la derecha -->
      <div class="cab-acc">
        <!-- Abre/cierra el buscador -->
        <button class="icono-btn" id="btn-buscar" aria-label="Buscar">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </button>
        <!-- Favoritos guardados -->
        <a href="#/favoritos" class="icono-btn" aria-label="Favoritos">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 20s-7-4.4-9.2-8.6A5 5 0 0 1 12 6a5 5 0 0 1 9.2 5.4C19 15.6 12 20 12 20Z"/></svg>
        </a>
        <!-- Carrito con contador -->
        <a href="#/carrito" class="icono-btn carrito-btn" aria-label="Carrito">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
          <span class="contador" id="contador">0</span>
        </a>
      </div>
    </div>
    <!-- Buscador desplegable -->
    <form class="buscador" id="buscador" hidden>
      <input type="search" id="q" placeholder="¿Qué estás buscando?" aria-label="Buscar productos" autocomplete="off">
    </form>
  </header>

  <!-- Menú lateral para celular -->
  <div class="menu-lat" id="menu-lat" hidden>
    <div class="menu-fondo" data-cerrar></div>
    <aside class="menu-panel">
      <div class="menu-cab">
        <span class="logo"><b>SANTOS</b><span>STORE</span></span>
        <button class="icono-btn" data-cerrar aria-label="Cerrar menú">✕</button>
      </div>
      <nav id="menu-links"></nav>
    </aside>
  </div>

  <!-- Aquí se dibuja cada pantalla (inicio, catálogo, producto, carrito...) -->
  <main id="app" tabindex="-1"></main>

  <!-- Pie de página -->
  <footer class="pie" id="pie"></footer>

  <!-- Botón flotante de WhatsApp -->
  <a class="wa-flot" id="wa-flot" target="_blank" rel="noopener" aria-label="Escríbenos por WhatsApp">
    <svg viewBox="0 0 32 32" width="30" height="30" fill="#fff"><path d="M16 3a13 13 0 0 0-11.2 19.6L3 29l6.6-1.7A13 13 0 1 0 16 3Zm0 23.7a10.7 10.7 0 0 1-5.5-1.5l-.4-.2-3.9 1 1-3.8-.3-.4A10.7 10.7 0 1 1 16 26.7Zm5.9-8c-.3-.2-1.9-1-2.2-1-.3-.1-.5-.2-.7.2l-1 1.2c-.2.2-.4.3-.7.1a8.8 8.8 0 0 1-4.4-3.8c-.3-.6.3-.5.9-1.7.1-.2 0-.4 0-.5l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6a1.2 1.2 0 0 0-.9.4 3.6 3.6 0 0 0-1.1 2.7 6.3 6.3 0 0 0 1.3 3.3 14.4 14.4 0 0 0 5.5 4.9c2 .9 2.8 1 3.8.8a3.3 3.3 0 0 0 2.1-1.5 2.7 2.7 0 0 0 .2-1.5c-.1-.2-.3-.3-.6-.4Z"/></svg>
  </a>

  <!-- Probador: botón flotante y panel para armar un outfit -->
  <button class="probador-btn" id="probador-btn" aria-label="Abrir probador">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 7a2 2 0 1 1 2-2c0 1.2-2 1.6-2 3v1l9 6.5a1 1 0 0 1-.6 1.8H3.6a1 1 0 0 1-.6-1.8L12 9"/></svg>
    Probador <b>0</b>
  </button>
  <aside class="probador" id="probador" aria-label="Probador" hidden></aside>

  <!-- Aviso breve -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Lógica de la tienda -->
  <script src="/js/tienda.js" type="module"></script>
</body>
</html>
